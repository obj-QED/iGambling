# Config must live on the default branch (`main`), but all PRs target `storybook` only.
# Grouped PRs — one per ecosystem so CI is not flooded with N× workflows.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: storybook
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      all-npm:
        patterns:
          - '*'
    labels:
      - dependencies
      - security
    assignees:
      - obj-QED
    commit-message:
      prefix: 'deps'
      include: 'scope'

  - package-ecosystem: github-actions
    directory: /
    target-branch: storybook
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      all-actions:
        patterns:
          - '*'
    labels:
      - dependencies
      - github-actions
    assignees:
      - obj-QED
    commit-message:
      prefix: 'ci'
      include: 'scope'

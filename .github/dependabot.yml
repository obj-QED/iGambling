# Storybook-branch Dependabot config (this branch only — not on `main`).
# GitHub loads dependabot.yml only from the repository default branch.
# With the file removed from `main`, Dependabot version updates are inactive
# unless the default branch changes or a minimal config is restored on `main`
# with target-branch: storybook.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: storybook
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      all-npm:
        patterns:
          - '*'
    labels:
      - dependencies
      - security
    assignees:
      - obj-QED
    commit-message:
      prefix: 'deps'
      include: 'scope'

  - package-ecosystem: github-actions
    directory: /
    target-branch: storybook
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      all-actions:
        patterns:
          - '*'
    labels:
      - dependencies
      - github-actions
    assignees:
      - obj-QED
    commit-message:
      prefix: 'ci'
      include: 'scope'

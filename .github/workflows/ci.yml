name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + Typecheck + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-yarn

      - name: Lint
        run: yarn lint

      - name: Stylelint
        run: yarn stylelint

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test

      - name: Dependency audit
        run: yarn audit:deps

      - name: App build
        run: yarn build

  build-storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-yarn

      - name: Build Storybook
        run: yarn build-storybook

      - name: Story index report
        run: node .github/scripts/storybook-index-report.mjs

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: storybook-static

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 14

      - name: Upload CI reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: storybook-reports
          path: reports/
          retention-days: 14
          if-no-files-found: ignore

  a11y:
    name: Accessibility
    runs-on: ubuntu-latest
    needs: build-storybook
    env:
      STORYBOOK_A11Y_STRICT: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-yarn

      - uses: actions/download-artifact@v8
        with:
          name: storybook-static
          path: storybook-static

      - name: Install Playwright browsers
        run: yarn playwright install chromium --with-deps

      - name: Run Storybook a11y tests
        run: yarn test:a11y

      - name: Upload a11y report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: storybook-a11y-report
          path: reports/a11y.json
          retention-days: 14
          if-no-files-found: ignore

  chromatic:
    name: Visual regression (Chromatic)
    runs-on: ubuntu-latest
    needs: build-storybook
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-yarn

      - uses: actions/download-artifact@v8
        with:
          name: storybook-static
          path: storybook-static

      - name: Publish to Chromatic
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          if [ -z "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo "CHROMATIC_PROJECT_TOKEN not set — skipping"
            exit 0
          fi
          yarn chromatic --storybook-build-dir=storybook-static --exit-zero-on-changes

  ai-review:
    name: AI design review
    runs-on: ubuntu-latest
    needs: build-storybook
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-yarn

      - uses: actions/download-artifact@v8
        with:
          name: storybook-static
          path: storybook-static

      - name: Generate AI review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY not set — skipping"
            exit 0
          fi
          yarn storybook:ai-review

      - name: Upload AI review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: storybook-ai-review
          path: reports/storybook-ai-review.txt
          retention-days: 14
          if-no-files-found: ignore

  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: build-storybook
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  report:
    name: PR report
    runs-on: ubuntu-latest
    needs: [quality, build-storybook, a11y]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/github-script@v9
        env:
          PAGES_URL: https://obj-qed.github.io/iGambling/
        with:
          script: |
            const pagesUrl = process.env.PAGES_URL;
            const sha = context.sha.slice(0, 7);
            const body = [
              '## CI',
              '',
              '| Check | Status |',
              '| --- | --- |',
              '| Lint + typecheck + unit tests | passed |',
              '| Storybook build | passed |',
              '| Accessibility (axe) | passed |',
              '',
              `Commit: \`${sha}\``,
              '',
              'After merge to `main`, Storybook deploys to:',
              pagesUrl,
              '',
              'Optional secrets: `CHROMATIC_PROJECT_TOKEN`, `OPENAI_API_KEY`.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '<!-- ci-report -->';
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: `${marker}\n${body}`,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `${marker}\n${body}`,
              });
            }

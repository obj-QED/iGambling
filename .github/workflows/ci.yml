name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-yarn

      - run: yarn lint
      - run: yarn stylelint
      - run: yarn test
      - run: yarn build

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  # One run per branch; cancel older pushes/PR syncs on the same ref.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-yarn

      - name: Lint
        run: yarn lint

      - name: Stylelint
        run: yarn stylelint

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test

      - name: Dependency audit
        run: yarn audit:deps

      - name: App build
        run: yarn build

      - name: Storybook build
        run: yarn build-storybook

      - name: Story index report
        run: node .github/scripts/storybook-index-report.mjs

      - name: Install Playwright browsers
        run: yarn playwright install chromium --with-deps

      - name: Storybook a11y
        env:
          STORYBOOK_A11Y_STRICT: "false"
        run: yarn test:a11y

      - name: Chromatic (optional)
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          if [ -z "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo "CHROMATIC_PROJECT_TOKEN not set — skipping"
            exit 0
          fi
          yarn chromatic --storybook-build-dir=storybook-static --exit-zero-on-changes

      - name: AI design review (optional)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY not set — skipping"
            exit 0
          fi
          yarn storybook:ai-review

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: |
            reports/
            storybook-static/
          retention-days: 14
          if-no-files-found: ignore

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

      - name: Deploy GitHub Pages
        id: deployment
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/deploy-pages@v4

      - name: PR report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PAGES_URL: https://obj-qed.github.io/iGambling/
        with:
          script: |
            const pagesUrl = process.env.PAGES_URL;
            const sha = context.sha.slice(0, 7);
            const body = [
              '## CI',
              '',
              'Single pipeline: lint → stylelint → typecheck → test → audit → build → storybook → a11y',
              '',
              `Commit: \`${sha}\``,
              '',
              'After merge to `main`, Storybook deploys to:',
              pagesUrl,
              '',
              'Optional secrets: `CHROMATIC_PROJECT_TOKEN`, `OPENAI_API_KEY`.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '<!-- ci-report -->';
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: `${marker}\n${body}`,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `${marker}\n${body}`,
              });
            }
